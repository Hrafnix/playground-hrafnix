name: Rust - Cargo Deny
on: [ pull_request ]

permissions:
  contents: read

jobs:
  rust-cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.88.0"
          log-level: warn
          command: check
          arguments: --all-features

name: Rust - Cargo Deny
on: [ pull_request ]
jobs:
  rust-cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.85.0"
          log-level: warn
          command: check
          arguments: --all-features

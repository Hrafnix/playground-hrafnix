name: Rust - MSRV
on: [ pull_request ]

permissions:
  contents: read

jobs:
  rust-msrv:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust 1.88.0
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check workspace on Rust 1.88.0
        run: cargo +1.88.0 check --workspace --all-targets --all-features --locked

name: Rust - MSRV
on: [ pull_request ]

permissions:
  contents: read

jobs:
  rust-msrv:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - name: Check workspace on Rust ${{ steps.msrv.outputs.version }}
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --all-features --locked

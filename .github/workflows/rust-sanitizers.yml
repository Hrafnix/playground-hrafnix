name: Rust - Sanitizers
on: [pull_request, workflow_dispatch]

jobs:
  rust-sanitizers:
    name: ${{ matrix.sanitizer }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - sanitizer: leak
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - sanitizer: memory
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - sanitizer: realtime
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - sanitizer: thread
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      RUSTDOCFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install nightly Rust and standard library sources
        run: rustup toolchain install nightly --component rust-src --profile minimal
      - name: Test Rust workspace with sanitizer
        run: cargo +nightly --config 'target.${{ matrix.target }}.rustflags=["-C","target-cpu=x86-64","-C","target-feature=-fma,-fma4","-Zsanitizer=${{ matrix.sanitizer }}","-D","warnings"]' test --workspace -Zbuild-std --target ${{ matrix.target }}

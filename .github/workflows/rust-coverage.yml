name: Rust - Coverage
on: [ pull_request ]

permissions:
  contents: read

jobs:
  rust-coverage:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update Rust
        run: rustup update
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov show-env --sh > "$RUNNER_TEMP/llvm-cov-env.sh"
          source "$RUNNER_TEMP/llvm-cov-env.sh"
          cargo test --workspace --all-features --locked --config 'target."cfg(all())".rustflags=["-D", "warnings"]'
          cargo llvm-cov report --html
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: target/llvm-cov/html
          if-no-files-found: error
      - name: Enforce coverage threshold
        run: |
          source "$RUNNER_TEMP/llvm-cov-env.sh"
          cargo llvm-cov report --fail-under-lines 85

name: Rust - Test
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  rust-test:
    name: ${{ matrix.os }} - ${{ matrix.profile }}
    strategy:
      matrix:
        os: [ macos-26, macos-26-intel, ubuntu-26.04, ubuntu-26.04-arm, windows-2025, windows-11-arm ]
        profile: [ debug, release ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build Rust project
        run: cargo --config 'target."cfg(all())".rustflags=["-D", "warnings"]' build --workspace --all-targets --all-features --locked ${{ matrix.profile == 'release' && '--release' || '' }}
      - name: Test Rust project
        run: cargo --config 'target."cfg(all())".rustflags=["-D", "warnings"]' test --workspace --all-features --locked ${{ matrix.profile == 'release' && '--release' || '' }}

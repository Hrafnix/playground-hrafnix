name: Workflow - Lint
on: [pull_request]

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
      - name: Lint GitHub Actions workflows
        run: |
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

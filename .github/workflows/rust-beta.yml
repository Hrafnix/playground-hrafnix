name: Rust - Beta
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  rust-beta:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust beta
        run: rustup toolchain install beta --profile minimal
      - name: Build workspace on Rust beta
        run: cargo +beta build --workspace --all-targets --all-features --locked --config 'target."cfg(all())".rustflags=["-D", "warnings"]'
      - name: Test workspace on Rust beta
        run: cargo +beta test --workspace --all-features --locked --config 'target."cfg(all())".rustflags=["-D", "warnings"]'

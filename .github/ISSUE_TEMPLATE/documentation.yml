name: Documentation
description: Suggest a documentation improvement
title: "[Documentation]: "
type: Task
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Before opening a new issue, search existing issues to verify that it is not a duplicate.
        If information is missing, we will work with you to gather the relevant details.
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Duplicate check
      options:
        - label: I searched existing issues for similar documentation requests.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Concisely summarize the documentation change.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link to the documentation or provide its file path and section.
      placeholder: "For example: README.md#running-the-tests"
    validations:
      required: true
  - type: textarea
    id: current-content
    attributes:
      label: Current content
      description: Quote or describe the wording that is missing, unclear, or incorrect.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem are we trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should we solve the problem?
    validations:
      required: true
  - type: textarea
    id: further-details
    attributes:
      label: Further details
      description: Include relevant use cases, benefits, goals, or other context.
  - type: textarea
    id: expertise
    attributes:
      label: Who can address the issue?
      description: Note any special expertise required to help with these changes.
  - type: textarea
    id: references
    attributes:
      label: Links or references
      description: Add any relevant links or references.
